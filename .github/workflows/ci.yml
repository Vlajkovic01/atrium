name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  server:
    name: Server build and tests
    # Pinned so the runner image changes when we decide, not when the
    # ubuntu-latest label moves.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      # The media tests run FFmpeg and ffprobe; libvips comes from NuGet.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore Atrium.slnx

      - name: Check formatting
        run: dotnet format Atrium.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Atrium.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Atrium.slnx --configuration Release --no-build

  clients:
    name: Clients build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API client is generated from the contract and committed.
      # Regenerating it must change nothing; if it does, someone changed
      # the contract and forgot to regenerate.
      - name: Generated files are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- packages/shared/src/api/schema.d.ts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @atrium/web run build

      - name: Build the server
        run: dotnet build server/src/Atrium.Api --configuration Release

      # Thumbnails in the browser tests come from the distribution's libvips,
      # as in the image.
      - name: Install the media tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg libvips42t64

      - name: Install the browser
        run: pnpm --filter @atrium/web exec playwright install --with-deps chromium

      # Starts the real server with the built web app and drives it in a browser.
      - name: Run
        run: pnpm --filter @atrium/web run e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  image:
    name: Docker image and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same command a person installing Atrium runs, building from
      # source. --wait returns only when the container reports healthy,
      # which exercises the image's own health check.
      - name: Build the image
        working-directory: deploy
        run: docker compose build

      # libvips, its HEIC decoder, FFmpeg and ffprobe, tried for real inside
      # the image before the server starts.
      - name: The media tools work in the image
        working-directory: deploy
        run: docker compose run --rm --no-deps atrium --check-media

      - name: Start with Compose
        working-directory: deploy
        run: docker compose up --detach --wait --wait-timeout 180

      - name: The server answers and serves the web app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/api/v1/health/ready
          curl --fail --silent --show-error http://localhost:8080/api/v1/system/info | grep --quiet '"name":"Atrium"'
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<div id="root">'
          curl --fail --silent --show-error --head http://localhost:8080/ | grep --ignore-case --quiet 'content-security-policy'

      - name: The server does not run as root
        working-directory: deploy
        run: |
          set -euo pipefail
          test "$(docker compose exec --no-TTY atrium id --user)" != "0"

      - name: Setup needs the token printed in the log
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose logs atrium | grep --quiet 'setup token'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery"}' \
            http://localhost:8080/api/v1/setup/admin)
          test "$status" = "403"

      - name: Data survives a restart
        working-directory: deploy
        run: |
          set -euo pipefail
          token=$(docker compose logs atrium | grep --only-matching 'first admin: [A-Za-z0-9_-]*' | tail --lines 1 | cut --delimiter ' ' --fields 3)
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"owner\",\"password\":\"correct horse battery\",\"setupToken\":\"$token\"}" \
            http://localhost:8080/api/v1/setup/admin
          docker compose restart atrium
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8080/api/v1/setup/state | grep --quiet '"adminExists":true'

      # The two optional parts of the Compose file, switched on the way the
      # install guide says: through a .env file.
      - name: Start again with PostgreSQL and HTTPS
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose down --volumes
          cat > .env <<'EOF'
          COMPOSE_PROFILES=postgres,https
          POSTGRES_PASSWORD=ci-password
          ATRIUM_DB_PROVIDER=postgres
          ATRIUM_DB_CONNECTION=Host=postgres;Database=atrium;Username=atrium;Password=ci-password
          ATRIUM_SETUP_TOKEN=a-setup-token-chosen-in-ci
          ATRIUM_DOMAIN=localhost
          EOF
          docker compose up --detach --wait --wait-timeout 240

      - name: A chosen setup token works and is not printed
        working-directory: deploy
        run: |
          set -euo pipefail
          ! docker compose logs atrium | grep --quiet 'a-setup-token-chosen-in-ci'
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery","setupToken":"a-setup-token-chosen-in-ci"}' \
            http://localhost:8080/api/v1/setup/admin

      - name: The data is in PostgreSQL
        working-directory: deploy
        run: |
          set -euo pipefail
          count=$(docker compose exec --no-TTY postgres psql --username atrium --dbname atrium --tuples-only --no-align --command 'select count(*) from "Users"')
          test "$count" = "1"

      # Through the bundled proxy the server must see HTTPS and the public
      # host name: the pairing link it hands out starts with https, and the
      # browser's refresh cookie is marked Secure.
      - name: Behind the HTTPS proxy the server knows the connection is HTTPS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl --insecure --fail --silent --output /dev/null https://localhost/api/v1/health/ready && break
            sleep 2
          done
          curl --insecure --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"device":{"name":"TV","kind":"tv"}}' \
            https://localhost/api/v1/auth/pairing | grep --quiet '"verificationUrl":"https://localhost/pair'
          curl --insecure --fail --silent --show-error --include \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery","device":{"name":"Browser","kind":"web"}}' \
            https://localhost/api/v1/auth/login | grep --ignore-case 'set-cookie' | grep --ignore-case --quiet 'secure'

      # When the server crashed, run it once more with the runtime's crash
      # report on, so the log shows where it died.
      - name: Crash report if the server crashed
        if: failure()
        working-directory: deploy
        run: |
          docker compose stop atrium || true
          mkdir -p /tmp/crash && chmod 777 /tmp/crash
          timeout 120 docker compose run --rm --no-deps \
            -v /tmp/crash:/crash \
            -e DOTNET_DbgEnableMiniDump=1 -e DOTNET_DbgMiniDumpType=1 \
            -e DOTNET_EnableCrashReport=1 -e DOTNET_DbgMiniDumpName=/crash/dump \
            atrium > /tmp/crash/server.log 2>&1 || echo "server ended with $?"
          tail -n 60 /tmp/crash/server.log | grep -v 'Microsoft.EntityFrameworkCore' || true
          for report in /tmp/crash/*.crashreport.json; do
            [ -f "$report" ] && python3 -c "
          import json,sys
          r=json.load(open(sys.argv[1]))
          p=r.get('payload',r)
          print('signal', p.get('signal') or r.get('signal'))
          for t in p.get('threads',[]):
            if t.get('crashed') or t.get('exception'):
              print('crashed thread', t.get('native_thread_id'), t.get('managed_exception_type'))
              for f in t.get('stack_frames',[])[:40]:
                print('  ', f.get('module_name'), f.get('method_name') or f.get('native_address'), f.get('unmanaged_name',''))
          " "$report" || head -c 20000 "$report"
          done

      - name: Show logs if something failed
        if: failure()
        working-directory: deploy
        run: |
          docker compose ps --all
          docker inspect --format 'exit code {{.State.ExitCode}}, restarts {{.RestartCount}}, error "{{.State.Error}}"' atrium-atrium-1 || true
          docker compose logs
