name: CI

# One pipeline in three stages, each starting only when the one before
# it passed (D-046):
#
#   1. Tests:   server, clients and end-to-end, side by side.
#   2. Image:   the Docker image is built and tried with Compose.
#   3. Publish: the image goes to the registries.
#
# - A pull request runs stages 1 and 2; nothing is published.
# - A merge to master publishes the image as "edge" and "sha-<commit>".
# - A version tag such as v0.1.0 publishes 0.1.0, 0.1 and "latest".
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless. A
# version build is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# The job names below are the required checks of the "Protect master"
# rule set. Renaming a job means updating the rule set too.
jobs:
  # Stage 1: tests.
  server:
    name: Server build and tests
    # Pinned so the runner image changes when we decide, not when the
    # ubuntu-latest label moves.
    runs-on: ubuntu-24.04
    # Every job has a limit a few times its usual length, so a hung
    # step fails soon instead of running for the default six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      # Downloaded packages are kept between runs (.github/actions/apt-cache).
      - uses: ./.github/actions/apt-cache
        with:
          step: restore
          name: server

      # The media tests run FFmpeg and ffprobe; libvips comes from NuGet.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - uses: ./.github/actions/apt-cache
        with:
          step: save
          name: server

      - name: Restore
        run: dotnet restore Atrium.slnx

      - name: Check formatting
        run: dotnet format Atrium.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Atrium.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Atrium.slnx --configuration Release --no-build

  clients:
    name: Clients build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API client is generated from the contract and committed.
      # Regenerating it must change nothing; if it does, someone changed
      # the contract and forgot to regenerate.
      - name: Generated files are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- packages/shared/src/api/schema.d.ts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @atrium/web run build

      - name: Build the server
        run: dotnet build server/src/Atrium.Api --configuration Release

      # Downloaded packages and the browser are kept between runs: the
      # runners' Ubuntu mirror is sometimes slow enough to take most of the
      # job's time.
      - uses: ./.github/actions/apt-cache
        with:
          step: restore
          name: e2e

      - name: Restore the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

      # Thumbnails in the browser tests come from the distribution's libvips,
      # as in the image.
      - name: Install the media tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg libvips42t64

      - name: Install the browser
        run: pnpm --filter @atrium/web exec playwright install --with-deps chromium

      - uses: ./.github/actions/apt-cache
        with:
          step: save
          name: e2e

      # Starts the real server with the built web app and drives it in a browser.
      - name: Run
        run: pnpm --filter @atrium/web run e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # The Android app, built the way a release is: the native project is
  # generated from mobile/app.json and compiled with the JavaScript inside.
  # Its type check and unit tests run with the other clients above. The
  # image does not wait for this job: the server does not depend on it.
  mobile:
    name: Mobile app build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # One architecture, the one phones have, keeps the build and the
      # file small. Signed with the debug key: installable for trying it
      # out, not a store release.
      # The build downloads several hundred megabytes of libraries from
      # Maven. Kept between runs, they are downloaded once, not every time.
      - uses: gradle/actions/setup-gradle@v4

      # A download that stalls must not fail a pull request: the waits are
      # longer than Gradle's default, and one failed build is tried again,
      # which continues with what the first attempt already fetched. A real
      # error fails both times and costs a few minutes more.
      - name: Build the APK
        working-directory: mobile/android
        run: |
          build() {
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              -Dorg.gradle.internal.http.connectionTimeout=120000
          }
          if ! build; then
            echo "::warning::The first build failed; trying once more."
            sleep 20
            build
          fi

      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: atrium-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Stage 2: the image, once the tests passed.
  image:
    name: Docker image and Compose
    needs: [server, clients, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The same command a person installing Atrium runs, building from
      # source. --wait returns only when the container reports healthy,
      # which exercises the image's own health check.
      - name: Build the image
        working-directory: deploy
        run: docker compose build

      # libvips, its HEIC decoder, FFmpeg and ffprobe, tried for real inside
      # the image before the server starts.
      - name: The media tools work in the image
        working-directory: deploy
        run: docker compose run --rm --no-deps atrium --check-media

      # A build with --enable-nonfree may not be redistributed at all
      # (docs/LICENSES.md, flag 1); the image must never carry one.
      - name: The image's FFmpeg may be redistributed
        working-directory: deploy
        run: |
          conf="$(docker compose run --rm --no-deps --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg atrium -hide_banner -buildconf)"
          echo "$conf" | head -5
          if echo "$conf" | grep -q -- "--enable-nonfree"; then
            echo "::error::The image's FFmpeg is built with --enable-nonfree"
            exit 1
          fi
          echo "$conf" | grep -q -- "--enable-gpl"

      - name: Start with Compose
        working-directory: deploy
        run: docker compose up --detach --wait --wait-timeout 180

      # Output is captured into a variable before grep reads it. Piping a
      # command straight into `grep --quiet` under pipefail is a race:
      # grep exits at the first match, the writer gets SIGPIPE if it is
      # still writing, and the step fails although the text was there.
      - name: The server answers and serves the web app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/api/v1/health/ready
          info=$(curl --fail --silent --show-error http://localhost:8080/api/v1/system/info)
          grep --quiet '"name":"Atrium"' <<<"$info"
          page=$(curl --fail --silent --show-error http://localhost:8080/)
          grep --quiet '<div id="root">' <<<"$page"
          headers=$(curl --fail --silent --show-error --head http://localhost:8080/)
          grep --ignore-case --quiet 'content-security-policy' <<<"$headers"

      - name: The server does not run as root
        working-directory: deploy
        run: |
          set -euo pipefail
          test "$(docker compose exec --no-TTY atrium id --user)" != "0"

      - name: Setup needs the token printed in the log
        working-directory: deploy
        run: |
          set -euo pipefail
          logs=$(docker compose logs atrium)
          grep --quiet 'setup token' <<<"$logs"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery"}' \
            http://localhost:8080/api/v1/setup/admin)
          test "$status" = "403"

      - name: Data survives a restart
        working-directory: deploy
        run: |
          set -euo pipefail
          token=$(docker compose logs atrium | grep --only-matching 'first admin: [A-Za-z0-9_-]*' | tail --lines 1 | cut --delimiter ' ' --fields 3)
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"owner\",\"password\":\"correct horse battery\",\"setupToken\":\"$token\"}" \
            http://localhost:8080/api/v1/setup/admin
          docker compose restart atrium
          docker compose up --detach --wait --wait-timeout 120
          state=$(curl --fail --silent --show-error http://localhost:8080/api/v1/setup/state)
          grep --quiet '"adminExists":true' <<<"$state"

      # The two optional parts of the Compose file, switched on the way the
      # install guide says: through a .env file.
      - name: Start again with PostgreSQL and HTTPS
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose down --volumes
          cat > .env <<'EOF'
          COMPOSE_PROFILES=postgres,https
          POSTGRES_PASSWORD=ci-password
          ATRIUM_DB_PROVIDER=postgres
          ATRIUM_DB_CONNECTION=Host=postgres;Database=atrium;Username=atrium;Password=ci-password
          ATRIUM_SETUP_TOKEN=a-setup-token-chosen-in-ci
          ATRIUM_DOMAIN=localhost
          EOF
          docker compose up --detach --wait --wait-timeout 240

      - name: A chosen setup token works and is not printed
        working-directory: deploy
        run: |
          set -euo pipefail
          logs=$(docker compose logs atrium)
          if grep --quiet 'a-setup-token-chosen-in-ci' <<<"$logs"; then
            echo "The chosen setup token appears in the log."
            exit 1
          fi
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery","setupToken":"a-setup-token-chosen-in-ci"}' \
            http://localhost:8080/api/v1/setup/admin

      - name: The data is in PostgreSQL
        working-directory: deploy
        run: |
          set -euo pipefail
          count=$(docker compose exec --no-TTY postgres psql --username atrium --dbname atrium --tuples-only --no-align --command 'select count(*) from "Users"')
          test "$count" = "1"

      # Through the bundled proxy the server must see HTTPS and the public
      # host name: the pairing link it hands out starts with https, and the
      # browser's refresh cookie is marked Secure.
      - name: Behind the HTTPS proxy the server knows the connection is HTTPS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl --insecure --fail --silent --output /dev/null https://localhost/api/v1/health/ready && break
            sleep 2
          done
          pairing=$(curl --insecure --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"device":{"name":"TV","kind":"tv"}}' \
            https://localhost/api/v1/auth/pairing)
          grep --quiet '"verificationUrl":"https://localhost/pair' <<<"$pairing"
          login=$(curl --insecure --fail --silent --show-error --include \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery","device":{"name":"Browser","kind":"web"}}' \
            https://localhost/api/v1/auth/login)
          cookie=$(grep --ignore-case 'set-cookie' <<<"$login")
          grep --ignore-case --quiet 'secure' <<<"$cookie"

      # When the server crashed, run it once more with the runtime's crash
      # report on, so the log shows where it died.
      - name: Crash report if the server crashed
        if: failure()
        working-directory: deploy
        run: |
          docker compose stop atrium || true
          mkdir -p /tmp/crash && chmod 777 /tmp/crash
          timeout 120 docker compose run --rm --no-deps \
            -v /tmp/crash:/crash \
            -e DOTNET_DbgEnableMiniDump=1 -e DOTNET_DbgMiniDumpType=1 \
            -e DOTNET_EnableCrashReport=1 -e DOTNET_DbgMiniDumpName=/crash/dump \
            atrium > /tmp/crash/server.log 2>&1 || echo "server ended with $?"
          grep -v '^\s\s\s\s\s\s' /tmp/crash/server.log | grep -v 'Microsoft.EntityFrameworkCore' | tail -n 40 || true
          sudo chmod -R a+rX /tmp/crash
          for report in /tmp/crash/*.crashreport.json; do
            [ -f "$report" ] && python3 -c "
          import json,sys
          r=json.load(open(sys.argv[1]))
          p=r.get('payload',r)
          print('signal', p.get('signal') or r.get('signal'))
          for t in p.get('threads',[]):
            if t.get('crashed'):
              print('crashed thread', t.get('native_thread_id'), t.get('managed_exception_type'))
              for f in t.get('stack_frames',[])[:40]:
                print('  ', f.get('module_name'), f.get('method_name') or f.get('native_address'), f.get('unmanaged_name',''))
          " "$report" || head -c 20000 "$report"
          done

      - name: Show logs if something failed
        if: failure()
        working-directory: deploy
        run: |
          docker compose ps --all
          docker inspect --format 'exit code {{.State.ExitCode}}, restarts {{.RestartCount}}, error "{{.State.Error}}"' atrium-atrium-1 || true
          docker compose logs

  # Stage 3: publish, once the image was built and tried; never for a
  # pull request. It goes to GitHub's registry always, and to Docker Hub
  # once the repository has DOCKERHUB_USERNAME and the secret
  # DOCKERHUB_TOKEN (deploy/README.md says how to set them).
  publish:
    name: Publish the image
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # The user name is not a secret, so a variable is the natural place;
      # one saved as a secret works too. Conditions cannot read secrets
      # directly, which is why it goes through the environment.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      # Emulation is needed only to assemble the ARM image's final stage;
      # the code itself is cross-compiled.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub's registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional, but leaving it out is said out loud: a
      # green run must not look as if it published there.
      - name: Docker Hub is not set up
        if: env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::warning::Not published to Docker Hub: DOCKERHUB_USERNAME is not set."
          echo "Not published to Docker Hub: \`DOCKERHUB_USERNAME\` is not set." >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/atrium,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 is published as 1.2.3, 1.2 and latest; master as edge.
          # There are no version tags before the first release, so
          # "latest" does not exist until then.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
