name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json

      - name: Restore
        run: dotnet restore Atrium.slnx

      - name: Check formatting
        run: dotnet format Atrium.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Atrium.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Atrium.slnx --configuration Release --no-build
