name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  server:
    name: Server build and tests
    # Pinned so the runner image changes when we decide, not when the
    # ubuntu-latest label moves.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - name: Restore
        run: dotnet restore Atrium.slnx

      - name: Check formatting
        run: dotnet format Atrium.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Atrium.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Atrium.slnx --configuration Release --no-build

  clients:
    name: Clients build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API client and the Cyrillic translations are generated files
      # that are committed. Regenerating them must change nothing; if it
      # does, someone changed a source and forgot to regenerate.
      - name: Generated files are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- packages/shared/src/api/schema.d.ts packages/shared/src/i18n/locales/sr-Cyrl.json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @atrium/web run build

      - name: Build the server
        run: dotnet build server/src/Atrium.Api --configuration Release

      - name: Install the browser
        run: pnpm --filter @atrium/web exec playwright install --with-deps chromium

      # Starts the real server with the built web app and drives it in a browser.
      - name: Run
        run: pnpm --filter @atrium/web run e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  image:
    name: Docker image and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same command a person installing Atrium runs, building from
      # source. --wait returns only when the container reports healthy,
      # which exercises the image's own health check.
      - name: Start with Compose
        working-directory: deploy
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: The server answers and serves the web app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/api/v1/health/ready
          curl --fail --silent --show-error http://localhost:8080/api/v1/system/info | grep --quiet '"name":"Atrium"'
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<div id="root">'
          curl --fail --silent --show-error --head http://localhost:8080/ | grep --ignore-case --quiet 'content-security-policy'

      - name: The server does not run as root
        working-directory: deploy
        run: |
          set -euo pipefail
          test "$(docker compose exec --no-TTY atrium id --user)" != "0"

      - name: Setup needs the token printed in the log
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose logs atrium | grep --quiet 'setup token'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"name":"owner","password":"correct horse battery"}' \
            http://localhost:8080/api/v1/setup/admin)
          test "$status" = "403"

      - name: Data survives a restart
        working-directory: deploy
        run: |
          set -euo pipefail
          token=$(docker compose logs atrium | grep --only-matching 'first admin: [A-Za-z0-9_-]*' | tail --lines 1 | cut --delimiter ' ' --fields 3)
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"owner\",\"password\":\"correct horse battery\",\"setupToken\":\"$token\"}" \
            http://localhost:8080/api/v1/setup/admin
          docker compose restart atrium
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8080/api/v1/setup/state | grep --quiet '"adminExists":true'

      - name: Show logs if something failed
        if: failure()
        working-directory: deploy
        run: docker compose logs
