name: Publish image

# Publishes the Atrium image (D-046):
# - every merge to master as "edge", the development build, and as
#   "sha-<commit>" so one exact build can be pulled again;
# - a version tag such as v0.1.0 as 0.1.0, 0.1 and "latest". There are no
#   version tags before the first release, so "latest" does not exist
#   until then and nobody gets a development build by accident.
# It goes to GitHub's registry always, and to Docker Hub once the
# repository has the variable DOCKERHUB_USERNAME and the secret
# DOCKERHUB_TOKEN (deploy/README.md says how to set them).
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer merge replaces an edge build still in progress; a version build
# is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Emulation is needed only to assemble the ARM image's final stage;
      # the code itself is cross-compiled.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: without the variable this step and the
      # Docker Hub image name below are left out, and the workflow still
      # publishes to GitHub's registry.
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/atrium,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 is published as 1.2.3, 1.2 and latest; master as edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
